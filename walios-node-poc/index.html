<!doctype html>
<meta charset="utf-8">
<title>walios-node</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { font-size: 14px; color: #8fd; margin: 0 0 4px; font-weight: 600; }
  .sub { color: #777; margin-bottom: 12px; }
  pre { white-space: pre-wrap; margin: 0; }
  #out { border-left: 2px solid #2a4; padding-left: 10px; }
  #err { border-left: 2px solid #a33; padding-left: 10px; color: #e99; margin-top: 10px; }
</style>
<h1>walios-node — node as a command in the walios shell</h1>
<div class="sub">busybox ash execs <code>node</code>; node-proc-worker.js is an ordinary walios process and every fs call is a syscall into wali-worker.js.</div>
<pre id="out"></pre>
<pre id="err"></pre>

<script src="/modules/walios-backend.js"></script>
<script>
const out = document.getElementById('out');
const err = document.getElementById('err');
const write = (el, s) => { el.textContent += s; };

// ?mode=repl boots an INTERACTIVE pty shell and lets the driver type into it, which
// is the only way to exercise `walios:/root$ node` -> the REPL. Default runs demo.sh.
const MODE = new URLSearchParams(location.search).get('mode') || 'demo';
let kernel = null;

// Driven by test-browser.mjs
window.__send = (s) => { if (kernel) kernel.postMessage({ t: 'stdin', data: s }); };
window.__text = () => out.textContent;

if (!crossOriginIsolated) {
  write(err, 'NOT cross-origin isolated — SharedArrayBuffer is unavailable.\nServe with COOP/COEP (use serve.mjs).\n');
} else {
  boot().catch((e) => write(err, 'boot failed: ' + ((e && e.stack) || e) + '\n'));
}

async function boot() {
  const WB = self.WALIOS_BACKEND;
  if (!WB) throw new Error('walios-backend.js did not load (serve the repo root)');

  kernel = new Worker('/walios/wali-worker.js');
  kernel.onerror = (e) => write(err, 'kernel worker error: ' + (e.message || e) + '\n');
  kernel.onmessage = (ev) => {
    const m = ev.data;
    if (m.t === 'out') write(m.fd === 2 ? err : out, m.s);
    else if (m.t === 'exit') write(out, '\n[process exited ' + m.code + ']\n');
  };

  // The root process is ALWAYS busybox: runMessage() sets {wasm: busybox, argv} and
  // argv[0] is what busybox dispatches on. The manifest is only consulted on execve.
  // So boot a SHELL and let it exec `node` -- correct wiring, and the real test.
  //
  // demo.sh is fetched as a FILE rather than embedded here. Embedding it meant
  // escaping through JS and then through ash, and a single backslash-n collapsed
  // into a raw newline inside a JS string literal, which node -e rejected.
  // Strip CR. On a Windows checkout demo.sh has CRLF endings, and ash then runs
  // `node -v<CR>` ("node: bad option") and tries to execute a bare CR on every
  // blank line (": not found"). Written without a regex literal on purpose:
  // the escape kept getting mangled on the way into this file.
  const CR = String.fromCharCode(13);
  const demo = (await (await fetch('./demo.sh')).text()).split(CR).join('');

  const common = {
    kind: 'tool',
    base: '/walios/',
    cwd: '/root',
    rpc: false,
    manifest: { node: '/walios-node-poc/node-stub.wasm' },
  };

  let msg;
  if (MODE === 'repl') {
    // pty: true gives a real terminal -- canonical mode, so the kernel does echo and
    // line editing and a read on fd 0 returns a finished line. That is what lets the
    // REPL work with no readline and no raw mode.
    msg = await WB.runMessage(Object.assign({}, common, { argv: ['sh'], pty: true, cols: 100, rows: 30 }));
  } else {
    const CR = String.fromCharCode(13);
    const demo = (await (await fetch('./demo.sh')).text()).split(CR).join('');
    const npmLite = await (await fetch('./npm-lite.js')).text();
    msg = await WB.runMessage(Object.assign({}, common, {
      argv: ['sh', '/demo.sh'],
      blobs: {
        '/demo.sh': new TextEncoder().encode(demo).buffer,
        '/usr/bin/npm-lite': new TextEncoder().encode(npmLite).buffer,
      },
    }));
  }
  kernel.postMessage(msg);
}
</script>
