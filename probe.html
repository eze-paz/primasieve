<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sandpie · GPU probe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:1rem 1rem 4rem; -webkit-text-size-adjust:100%; }
  h1 { font-size:1.15rem; color:#58a6ff; margin:0 0 0.15rem; }
  .sub { color:#8b949e; margin:0 0 1rem; font-size:0.82rem; }
  h2 { font-size:0.9rem; color:#d29922; margin:1.2rem 0 0.4rem; border-bottom:1px solid #21262d; padding-bottom:0.2rem; }
  table { border-collapse:collapse; width:100%; font-size:0.82rem; }
  td { padding:0.28rem 0.5rem; border-bottom:1px solid #161b22; vertical-align:top; word-break:break-word; }
  td.k { color:#8b949e; white-space:nowrap; width:42%; }
  td.v { color:#c9d1d9; font-family:ui-monospace, Menlo, monospace; }
  .ok { color:#3fb950; } .bad { color:#f85149; } .warn { color:#d29922; }
  .verdict { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:0.8rem; margin:0.6rem 0; }
  .verdict div { margin:0.25rem 0; font-size:0.86rem; }
  button { font:inherit; font-weight:600; background:#238636; color:#fff; border:0; border-radius:8px; padding:0.7rem 1rem; width:100%; margin:0.5rem 0; cursor:pointer; }
  button.sec { background:#21262d; color:#c9d1d9; border:1px solid #30363d; }
  pre { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:0.7rem; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:0.72rem; max-height:45vh; }
  #status { color:#d29922; font-size:0.85rem; min-height:1.2em; }
</style>
</head>
<body>
<h1>sandpie · GPU capability probe</h1>
<p class="sub">Runs entirely on this device. Tap <b>Copy results</b> and paste them back so we can tell exactly which engine fallbacks your phone needs.</p>
<div id="status">Probing…</div>
<button id="copyTop">Copy results</button>
<div id="verdict" class="verdict" style="display:none"></div>
<div id="sections"></div>
<button id="copyBot" class="sec">Copy results</button>
<h2>Raw (for paste)</h2>
<pre id="raw">…</pre>

<script>
(function () {
  'use strict';
  // Belt-and-suspenders: if a stale service worker controls this page, drop it so we're on the
  // live network copy (the main app evicts SWs too — this page shouldn't depend on that having run).
  try { if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); } catch (e) {}

  var R = { _generated: 'sandpie GPU probe' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
  var MB = function (n) { return (n == null) ? '?' : (n / 1048576).toFixed(0) + ' MB'; };
  var GB = function (n) { return (n == null) ? '?' : (n / 1073741824).toFixed(2) + ' GB'; };

  function render() {
    // Sections table
    var html = '';
    var order = ['environment', 'webgpu', 'adapterInfo', 'features', 'limits', 'subgroups', 'f16', 'numeric', 'bandwidth', 'storage'];
    var titles = { environment: 'Environment', webgpu: 'WebGPU', adapterInfo: 'Adapter', features: 'Features', limits: 'Key limits', subgroups: 'Subgroups', f16: 'shader-f16', numeric: 'Numeric self-test (f32)', bandwidth: 'Memory bandwidth', storage: 'Storage quota' };
    order.forEach(function (sec) {
      var obj = R[sec]; if (!obj) return;
      html += '<h2>' + titles[sec] + '</h2><table>';
      Object.keys(obj).forEach(function (k) {
        html += '<tr><td class="k">' + esc(k) + '</td><td class="v">' + esc(obj[k]) + '</td></tr>';
      });
      html += '</table>';
    });
    $('sections').innerHTML = html;
    $('raw').textContent = JSON.stringify(R, null, 1);
    if (R.verdict) {
      var v = $('verdict'); v.style.display = 'block';
      v.innerHTML = '<h2 style="margin-top:0">Verdict</h2>' + R.verdict.map(function (x) {
        var cls = x.s === 'ok' ? 'ok' : x.s === 'bad' ? 'bad' : 'warn';
        return '<div><span class="' + cls + '">' + (x.s === 'ok' ? '✓' : x.s === 'bad' ? '✗' : '!') + '</span> ' + esc(x.t) + '</div>';
      }).join('');
    }
  }
  function copy() {
    var txt = JSON.stringify(R, null, 1);
    try {
      navigator.clipboard.writeText(txt).then(function () { $('status').textContent = 'Copied to clipboard — paste it back.'; },
        function () { selectRaw(); });
    } catch (e) { selectRaw(); }
  }
  function selectRaw() {
    var el = $('raw'); $('status').textContent = 'Select the text below and copy manually.';
    try { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  $('copyTop').addEventListener('click', copy);
  $('copyBot').addEventListener('click', copy);

  function safe(fn) { try { return fn(); } catch (e) { return 'ERROR: ' + ((e && e.message) || e); } }

  (async function main() {
    // ---- environment (never fails) ----
    R.environment = {
      userAgent: navigator.userAgent,
      platform: safe(function () { return navigator.platform; }),
      deviceMemory_GB: (navigator.deviceMemory != null ? navigator.deviceMemory : '(not reported)'),
      hardwareConcurrency: navigator.hardwareConcurrency || '?',
      screen: (screen.width + '×' + screen.height + ' @' + (window.devicePixelRatio || 1) + 'x'),
      secureContext: '' + window.isSecureContext,
      crossOriginIsolated: '' + (typeof crossOriginIsolated !== 'undefined' ? crossOriginIsolated : 'n/a'),
      url: location.href,
    };
    render();

    // ---- storage (async, independent) ----
    try {
      if (navigator.storage && navigator.storage.estimate) {
        var est = await navigator.storage.estimate();
        R.storage = { quota: GB(est.quota), usage: MB(est.usage), persisted: safe(async function () { return navigator.storage.persisted ? await navigator.storage.persisted() : 'n/a'; }) };
        try { R.storage.persisted = navigator.storage.persisted ? '' + (await navigator.storage.persisted()) : 'n/a'; } catch (e) {}
      } else R.storage = { estimate: 'unavailable' };
    } catch (e) { R.storage = { error: '' + e }; }
    render();

    // ---- WebGPU ----
    if (!('gpu' in navigator)) {
      R.webgpu = { available: 'NO — navigator.gpu is missing (browser/OS has no WebGPU)' };
      R.verdict = [{ s: 'bad', t: 'WebGPU is NOT available in this browser. The in-browser engine cannot run here — needs Chrome/Edge (Android) or Safari 17.4+ (iOS).' }];
      $('status').textContent = 'Done — WebGPU unavailable.'; render(); return;
    }
    var adapter = null;
    try { adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); } catch (e) {}
    if (!adapter) { try { adapter = await navigator.gpu.requestAdapter(); } catch (e) {} }
    if (!adapter) {
      R.webgpu = { available: 'navigator.gpu present but requestAdapter() returned null (no compatible GPU / disabled)' };
      R.verdict = [{ s: 'bad', t: 'WebGPU present but no usable adapter. May be disabled by the browser or GPU blocklist.' }];
      $('status').textContent = 'Done — no adapter.'; render(); return;
    }
    R.webgpu = { available: 'yes', isFallbackAdapter: '' + !!adapter.isFallbackAdapter };

    // adapter info
    try {
      var info = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
      if (info) R.adapterInfo = { vendor: info.vendor || '?', architecture: info.architecture || '?', device: info.device || '?', description: info.description || '?' };
    } catch (e) { R.adapterInfo = { error: '' + e }; }
    render();

    // features
    var feats = [];
    try { adapter.features.forEach(function (f) { feats.push(f); }); } catch (e) {}
    var hasF16 = feats.indexOf('shader-f16') !== -1;
    var hasSG = feats.indexOf('subgroups') !== -1;
    R.features = {
      'shader-f16': hasF16 ? 'YES' : 'no',
      'subgroups': hasSG ? 'YES' : 'no',
      'subgroups-f16': feats.indexOf('subgroups-f16') !== -1 ? 'yes' : 'no',
      'timestamp-query': feats.indexOf('timestamp-query') !== -1 ? 'yes' : 'no',
      'all': feats.join(', ') || '(none)',
    };
    render();

    // limits
    var L = adapter.limits || {};
    R.limits = {
      maxStorageBufferBindingSize: MB(L.maxStorageBufferBindingSize) + '  (' + (L.maxStorageBufferBindingSize || 0) + ')',
      maxBufferSize: MB(L.maxBufferSize),
      maxComputeWorkgroupStorageSize: (L.maxComputeWorkgroupStorageSize || '?') + ' bytes',
      maxComputeInvocationsPerWorkgroup: L.maxComputeInvocationsPerWorkgroup || '?',
      maxComputeWorkgroupSizeX: L.maxComputeWorkgroupSizeX || '?',
      maxStorageBuffersPerShaderStage: L.maxStorageBuffersPerShaderStage || '?',
      maxBindGroups: L.maxBindGroups || '?',
    };
    if (L.minSubgroupSize != null) R.limits.minSubgroupSize = L.minSubgroupSize;
    if (L.maxSubgroupSize != null) R.limits.maxSubgroupSize = L.maxSubgroupSize;
    render();

    // request a device with the available features (mirrors the engine's init)
    var device = null;
    try {
      var want = ['shader-f16', 'subgroups', 'subgroups-f16', 'timestamp-query'].filter(function (f) { return feats.indexOf(f) !== -1; });
      device = await adapter.requestDevice({ requiredFeatures: want });
      var en = []; device.features.forEach(function (f) { en.push(f); });
      R.webgpu.enabledFeatures = en.join(', ') || '(none)';
    } catch (e) { R.webgpu.requestDevice = 'FAILED: ' + ((e && e.message) || e); render(); }
    render();

    var mkPipe = async function (code) {
      var mod = device.createShaderModule({ code: code });
      if (mod.getCompilationInfo) { var ci = await mod.getCompilationInfo(); for (var i = 0; i < ci.messages.length; i++) if (ci.messages[i].type === 'error') throw new Error(ci.messages[i].message); }
      return device.createComputePipeline({ layout: 'auto', compute: { module: mod, entryPoint: 'main' } });
    };
    var readU32 = async function (buf, n) {
      var stg = device.createBuffer({ size: n * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      var enc = device.createCommandEncoder(); enc.copyBufferToBuffer(buf, 0, stg, 0, n * 4); device.queue.submit([enc.finish()]);
      await stg.mapAsync(GPUMapMode.READ); var out = new Uint32Array(stg.getMappedRange().slice(0)); stg.unmap(); stg.destroy(); return out;
    };
    var readF32 = async function (buf, n) {
      var stg = device.createBuffer({ size: n * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      var enc = device.createCommandEncoder(); enc.copyBufferToBuffer(buf, 0, stg, 0, n * 4); device.queue.submit([enc.finish()]);
      await stg.mapAsync(GPUMapMode.READ); var out = new Float32Array(stg.getMappedRange().slice(0)); stg.unmap(); stg.destroy(); return out;
    };

    // ---- subgroup size probe (only if the feature is present) ----
    if (device && hasSG) {
      try {
        var out = device.createBuffer({ size: 8, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
        var p = await mkPipe('enable subgroups;\n@group(0) @binding(0) var<storage, read_write> o: array<u32>;\n@compute @workgroup_size(128) fn main(@builtin(subgroup_size) s:u32, @builtin(local_invocation_index) li:u32){ if(li==0u){o[0]=s;} }');
        var bg = device.createBindGroup({ layout: p.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: out } }] });
        var enc = device.createCommandEncoder(); var pass = enc.beginComputePass(); pass.setPipeline(p); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(1); pass.end(); device.queue.submit([enc.finish()]);
        var sz = (await readU32(out, 1))[0]; out.destroy();
        R.subgroups = { supported: 'yes', subgroupSize: sz };
      } catch (e) { R.subgroups = { supported: 'feature present but probe FAILED', error: '' + ((e && e.message) || e) }; }
    } else R.subgroups = { supported: hasSG ? 'yes (no device)' : 'NO — kernels need a shared-memory reduction fallback' };
    render();

    // ---- f16 compile probe ----
    if (device) {
      if (hasF16) {
        try { await mkPipe('enable f16;\n@group(0) @binding(0) var<storage, read_write> o: array<f16>;\n@compute @workgroup_size(1) fn main(){ o[0] = f16(1.5) * f16(2.0); }'); R.f16 = { compiles: 'YES' }; }
        catch (e) { R.f16 = { compiles: 'feature present but shader FAILED to compile', error: '' + ((e && e.message) || e) }; }
      } else R.f16 = { compiles: 'NO — kernels need an f32-scale fallback variant' };
    }
    render();

    // ---- numeric self-test: f32 GEMV vs CPU (portable; no f16/subgroups) ----
    if (device) {
      try {
        var N = 64, K = 128;
        var A = new Float32Array(N * K), x = new Float32Array(K);
        var seed = 12345, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647 * 2 - 1; };
        for (var i = 0; i < A.length; i++) A[i] = rnd(); for (var j = 0; j < K; j++) x[j] = rnd();
        var mk = function (arr) { var b = device.createBuffer({ size: arr.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(b, 0, arr); return b; };
        var Ab = mk(A), xb = mk(x), yb = device.createBuffer({ size: N * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
        var db = device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(db, 0, new Uint32Array([N, K]));
        var pp = await mkPipe('struct D{n:u32,k:u32};\n@group(0) @binding(0) var<storage,read> A:array<f32>;\n@group(0) @binding(1) var<storage,read> x:array<f32>;\n@group(0) @binding(2) var<storage,read_write> y:array<f32>;\n@group(0) @binding(3) var<uniform> d:D;\n@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) g:vec3<u32>){ let r=g.x; if(r>=d.n){return;} var s=0.0; for(var c=0u;c<d.k;c=c+1u){ s=s+A[r*d.k+c]*x[c]; } y[r]=s; }');
        var bg2 = device.createBindGroup({ layout: pp.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: Ab } }, { binding: 1, resource: { buffer: xb } }, { binding: 2, resource: { buffer: yb } }, { binding: 3, resource: { buffer: db } }] });
        var e2 = device.createCommandEncoder(); var pa = e2.beginComputePass(); pa.setPipeline(pp); pa.setBindGroup(0, bg2); pa.dispatchWorkgroups(1); pa.end(); device.queue.submit([e2.finish()]);
        var got = await readF32(yb, N), maxErr = 0;
        for (var r = 0; r < N; r++) { var ref = 0; for (var c = 0; c < K; c++) ref += A[r * K + c] * x[c]; maxErr = Math.max(maxErr, Math.abs(ref - got[r])); }
        R.numeric = { maxAbsError: maxErr.toExponential(2), verdict: maxErr < 1e-3 ? 'PASS' : 'FAIL — driver f32 compute is off' };
        [Ab, xb, yb, db].forEach(function (b) { b.destroy(); });
      } catch (e) { R.numeric = { error: '' + ((e && e.message) || e) }; }
    }
    render();

    // ---- memory bandwidth micro-bench (portable f32; bounded to stay under mobile watchdogs) ----
    if (device) {
      try {
        var bytes = Math.min(48 * 1048576, (L.maxStorageBufferBindingSize || 48 * 1048576) - 4096, (L.maxBufferSize || 48 * 1048576) - 4096);
        var vecs = Math.floor(bytes / 16); bytes = vecs * 16;
        var big = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE });
        var res = device.createBuffer({ size: 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
        var ub = device.createBuffer({ size: 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(ub, 0, new Uint32Array([vecs]));
        var bwp = await mkPipe('@group(0) @binding(0) var<storage,read> b:array<vec4<f32>>;\n@group(0) @binding(1) var<storage,read_write> o:array<f32>;\n@group(0) @binding(2) var<uniform> n:u32;\nvar<workgroup> sh:f32;\n@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) g:vec3<u32>,@builtin(local_invocation_index) li:u32){ var s=0.0; var i=g.x; loop{ if(i>=n){break;} let v=b[i]; s=s+v.x+v.y+v.z+v.w; i=i+256u*1024u; } if(s==1234.5){o[0]=s;} }');
        var bwg = device.createBindGroup({ layout: bwp.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: big } }, { binding: 1, resource: { buffer: res } }, { binding: 2, resource: { buffer: ub } }] });
        var iters = 20, wg = 1024;
        // warm
        var we = device.createCommandEncoder(); var wp = we.beginComputePass(); wp.setPipeline(bwp); wp.setBindGroup(0, bwg); wp.dispatchWorkgroups(wg); wp.end(); device.queue.submit([we.finish()]); await device.queue.onSubmittedWorkDone();
        var t0 = performance.now();
        for (var it = 0; it < iters; it++) { var be = device.createCommandEncoder(); var bp = be.beginComputePass(); bp.setPipeline(bwp); bp.setBindGroup(0, bwg); bp.dispatchWorkgroups(wg); bp.end(); device.queue.submit([be.finish()]); }
        await device.queue.onSubmittedWorkDone();
        var secs = (performance.now() - t0) / 1000;
        var gbps = (bytes * iters) / 1e9 / secs;
        R.bandwidth = { bufferMoved: MB(bytes) + ' × ' + iters, seconds: secs.toFixed(2), approx_GBps: gbps.toFixed(1), note: 'wall-clock estimate (timestamp-query may be absent)' };
        big.destroy(); res.destroy(); ub.destroy();
      } catch (e) { R.bandwidth = { error: '' + ((e && e.message) || e) }; }
    }
    render();

    // ---- verdict ----
    var v = [];
    v.push(hasF16 ? { s: 'ok', t: 'shader-f16 present — current kernels compile as-is.' } : { s: 'warn', t: 'NO shader-f16 — every kernel needs an f32-scale variant (11 enable-f16 sites in LFM2.5).' });
    v.push(hasSG ? { s: 'ok', t: 'subgroups present (size ' + (R.subgroups && R.subgroups.subgroupSize || '?') + ') — but WG=32 tuning is Iris-specific; retune.' } : { s: 'warn', t: 'NO subgroups — reductions (7 subgroupAdd sites) need shared-memory fallback.' });
    var bind = L.maxStorageBufferBindingSize || 0;
    if (bind >= 900 * 1048576) v.push({ s: 'ok', t: 'maxStorageBufferBindingSize ' + MB(bind) + ' — 8B int3 pools (~900 MB single buffers) fit unbanked.' });
    else if (bind >= 128 * 1048576) v.push({ s: 'warn', t: 'maxStorageBufferBindingSize ' + MB(bind) + ' — 8B int3 pools (900 MB) EXCEED it; need buffer banking. Smaller models fine.' });
    else v.push({ s: 'bad', t: 'maxStorageBufferBindingSize only ' + MB(bind) + ' — big models infeasible; needs banking + a small model.' });
    var mem = navigator.deviceMemory || 0;
    if (mem && mem <= 4) v.push({ s: 'warn', t: 'deviceMemory ~' + mem + ' GB — target 350M/0.6B; 8B (~4.3 GB) will not fit.' });
    else if (mem && mem >= 8) v.push({ s: 'ok', t: 'deviceMemory ~' + mem + ' GB — could hold a mid/large model if binding limits allow.' });
    if (R.numeric && /FAIL/.test(R.numeric.verdict || '')) v.push({ s: 'bad', t: 'f32 numeric self-test FAILED — driver correctness issue; results untrustworthy.' });
    R.verdict = v;
    $('status').textContent = 'Done. Tap “Copy results”.';
    render();
    try { device && device.destroy && device.destroy(); } catch (e) {}
  })().catch(function (e) { $('status').textContent = 'Probe error: ' + ((e && e.message) || e); R.fatal = '' + ((e && e.stack) || e); render(); });
})();
</script>
</body>
</html>
