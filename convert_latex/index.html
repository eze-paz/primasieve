<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandpie — LaTeX to PDF</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 1rem;
  }
  .card {
    width: 100%; max-width: 700px;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 1.5rem 1.75rem;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.1rem; color: #e6edf3; margin: 0 0 .75rem; }
  #projectPath { font-family: ui-monospace,monospace; color: #8b949e; margin-bottom: 1rem; }
  #filetree { margin-top: .75rem; max-height: 220px; overflow-y: auto; border: 1px solid #30363d; border-radius: 6px; padding: .5rem; }
  #filetree ul { list-style: none; padding: 0; margin: .25rem 0; }
  #filetree li { font-size: .85rem; color: #8b949e; padding: .15rem 0; }
  #filetree li.master { color: #58a6ff; font-weight: 600; }
  #filetree li::before { content: "📄 "; }
  #filetree li.dir::before { content: "📁 "; }
  button.primary {
    background: #238636; color: #fff; border: 0; border-radius: 6px;
    padding: .5rem 1.25rem; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #30363d; cursor: not-allowed; }
  button.secondary {
    background: #30363d; color: #c9d1d9; border: 0; border-radius: 6px;
    padding: .45rem 1rem; font-size: .85rem; cursor: pointer; margin-left: .5rem;
  }
  #status { min-height: 2em; color: #8b949e; margin-top: .75rem; white-space: pre-wrap; }
  #status.err { color: #f85149; }
  #status.ok  { color: #3fb950; }
  #result { margin-top: .75rem; }
  #logpanel {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    margin-top: .75rem; max-height: 250px; overflow-y: auto;
    font-family: ui-monospace, monospace; font-size: .78rem;
    white-space: pre-wrap; padding: .75rem; color: #8b949e;
    display: none;
  }
  #logpanel.visible { display: block; }
  #progressBar {
    width: 100%; height: 6px; background: #30363d; border-radius: 3px;
    margin-top: .5rem; overflow: hidden; display: none;
  }
  #progressBar .bar {
    height: 100%; width: 0%; background: #238636; border-radius: 3px;
    transition: width .3s ease;
  }
  #progressBar.visible { display: block; }
  iframe { width: 100%; height: 60vh; border: 1px solid #30363d; border-radius: 6px; }
  .hint { font-size: .8rem; color: #6e7681; margin-top: 1rem; }
  .actions { margin-top: 1rem; }
  a.dl {
    display: inline-block; background: #238636; color: #fff;
    text-decoration: none; padding: .5rem 1.25rem; border-radius: 6px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="card" id="stage1">
  <h1>LaTeX → PDF</h1>
  <div id="projectPath">(no project selected)</div>
  <div id="filetree"></div>
  <div class="actions" id="actions" style="display:none">
    <button class="primary" id="compileBtn" disabled>Compile</button>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>
  <div id="status"></div>
  <div id="progressBar"><div class="bar" id="progressFill"></div></div>
  <div id="logpanel"></div>
</div>

<div class="card" id="stage2" style="display:none">
  <h1>Result</h1>
  <div id="result"></div>
  <div class="hint">Powered by <a href="https://github.com/busytex/busytex" target="_blank" style="color:#8b949e">BusyTeX</a> — runs entirely in your browser. First compile downloads ~120 MB of LaTeX packages.</div>
</div>

<script>
(() => {
  'use strict';

  const BUSYTEX_BASE = 'https://busytex.github.io/dist/';

  const $path    = document.getElementById('projectPath');
  const $tree    = document.getElementById('filetree');
  const $actions = document.getElementById('actions');
  const $btn     = document.getElementById('compileBtn');
  const $clear   = document.getElementById('clearBtn');
  const $status  = document.getElementById('status');
  const $log     = document.getElementById('logpanel');
  const $stage1  = document.getElementById('stage1');
  const $stage2  = document.getElementById('stage2');
  const $result  = document.getElementById('result');
  const $progBar = document.getElementById('progressBar');
  const $progFill = document.getElementById('progressFill');

  let fileMap    = {};
  let masterFile = '';
  let worker     = null;

  const setStatus = (msg, cls) => { $status.textContent = msg; $status.className = cls || ''; };
  const logAppend = (txt) => { $log.textContent += txt + '\n'; $log.classList.add('visible'); };
  const setProgress = (pct) => { $progFill.style.width = Math.min(100, Math.max(0, pct)) + '%'; };

  // ===== OPFS helpers =====
  async function getDb() {
    return await navigator.storage.getDirectory();
  }

  async function resolveDir(parts) {
    let dir = await getDb();
    for (const p of parts) {
      dir = await dir.getDirectoryHandle(p, { create: false });
    }
    return dir;
  }

  async function walkDir(dir, prefix, out) {
    for await (const [name, handle] of dir.entries()) {
      const full = prefix ? prefix + '/' + name : name;
      if (handle.kind === 'directory') {
        out.dirs.push(full);
        if (name === 'node_modules' || name === '.git' || name.startsWith('.')) continue;
        await walkDir(handle, full, out);
      } else {
        out.files.push(full);
        if (name.endsWith('.tex')) out.texFiles.push(full);
      }
    }
  }

  async function readFileBytes(path) {
    const parts = path.split('/');
    const name = parts.pop();
    const dir = await resolveDir(parts);
    const fh = await dir.getFileHandle(name);
    const f = await fh.getFile();
    return new Uint8Array(await f.arrayBuffer());
  }

  // ===== Project loading =====
  async function loadProject(projectPath) {
    if (!projectPath) { setStatus('No project specified.', 'err'); return; }
    fileMap = {};
    masterFile = '';
    $path.textContent = '/' + projectPath;
    setStatus('Scanning project…');
    $progBar.classList.remove('visible');
    $log.textContent = ''; $log.classList.remove('visible');

    try {
      const rootDir = await resolveDir(projectPath.split('/').filter(Boolean));
      const out = { files: [], dirs: [], texFiles: [] };
      await walkDir(rootDir, '', out);

      // ── Hydrate any dehydrated subdir files the cloud index knows about ──
      const getSandpie = () => window.Sandpie || (window.opener && window.opener.Sandpie) || (window.parent && window.parent !== window && window.parent.Sandpie) || null;
      const spObj = getSandpie();
      const sp = spObj && spObj.syncProvider ? spObj.syncProvider() : null;
      if (sp && sp.cloudIndex && sp.hydrate) {
        const idx = sp.cloudIndex();
        if (idx) {
          const prefix = projectPath.replace(/^\/+/, '') + '/';
          for (const [key, entry] of Object.entries(idx)) {
            if (entry.kind !== 'file' || !key.startsWith(prefix)) continue;
            const rel = key.slice(prefix.length);
            if (out.files.includes(rel)) continue;
            try {
              await sp.hydrate(key);
              out.files.push(rel);
              if (rel.endsWith('.tex')) out.texFiles.push(rel);
            } catch (_) { /* skip files we can't hydrate */ }
          }
        }
      }

      for (const p of out.files) {
        const bytes = await readFileBytes(projectPath + '/' + p);
        fileMap[p] = bytes;
      }

      masterFile = '';
      for (const p of out.texFiles) {
        if (/\bmain\.tex$/i.test(p)) { masterFile = p; break; }
      }
      if (!masterFile) {
        for (const p of out.texFiles) {
          const text = new TextDecoder().decode(fileMap[p].slice(0, 8192));
          if (/^\s*\\\s*documentclass\s*[\[{]/m.test(text)) { masterFile = p; break; }
        }
      }
      if (!masterFile && out.texFiles.length) masterFile = out.texFiles[0];

      renderTree(out);
      $actions.style.display = '';
      $btn.disabled = !masterFile;
      setStatus(masterFile ? 'Found master: /' + projectPath + '/' + masterFile : 'No master file with \\documentclass found.', masterFile ? 'ok' : 'err');
    } catch (e) {
      setStatus('Error loading project: ' + (e && e.message), 'err');
    }
  }

  function renderTree(out) {
    const html = ['<ul>'];
    out.dirs.sort().forEach(d => html.push('<li class="dir">' + d + '/</li>'));
    out.files.sort().forEach(p => {
      html.push('<li class="' + (p === masterFile ? 'master' : '') + '">' + p + '</li>');
    });
    html.push('</ul>');
    $tree.innerHTML = html.join('');
  }

  // ===== BusyTeX Worker =====
  function makeWorkerCode() {
    return [
'const BUSYTEX_BASE = \'' + BUSYTEX_BASE + '\';',
'',
'self.Module = {',
'  locateFile: function(path, prefix) {',
'    return BUSYTEX_BASE + path;',
'  }',
'};',
'',
'importScripts(location.origin + \'/convert_latex/vendor/busytex_pipeline.js\');',
'',
'self.pipeline = null;',
'self.data_packages_js = [',
'  BUSYTEX_BASE + \'texlive-basic.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-latex-recommended.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-latex-extra.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-science.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-fonts-recommended.js\'',
'];',
'self.preload_data_packages_js = [',
'  BUSYTEX_BASE + \'texlive-basic.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-latex-recommended.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-latex-extra.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-science.js\',',
'  BUSYTEX_BASE + \'ubuntu-texlive-fonts-recommended.js\'',
'];',
'',
'onmessage = async function(ev) {',
'  var data = ev.data;',
'  var action = data.action, files = data.files, main_tex_path = data.main_tex_path, verbose = data.verbose;',
'',
'  if (action === \'init\') {',
'    try {',
'      self.pipeline = new BusytexPipeline(',
'        BUSYTEX_BASE + \'busytex.js\',',
'        BUSYTEX_BASE + \'busytex.wasm\',',
'        self.data_packages_js,',
'        self.preload_data_packages_js,',
'        [],',
'        function(msg) { postMessage({type: \'print\', text: msg}); },',
'        function(versions) { postMessage({type: \'initialized\', versions: versions}); },',
'        true,',
'        BusytexPipeline.ScriptLoaderWorker',
'      );',
'    } catch (err) {',
'      postMessage({type: \'error\', text: \'Init error: \' + err.message + \'\\n\' + err.stack});',
'    }',
'    return;',
'  }',
'',
'  if (action === \'compile\') {',
'    if (!self.pipeline) {',
'      postMessage({type: \'error\', text: \'Pipeline not initialized\'});',
'      return;',
'    }',
'    try {',
'      postMessage({type: \'print\', text: \'Initializing XeTeX engine...\'});',
'      // Initialize the WASM module (normally done by compile(), but we bypass it)',
'      await self.pipeline.reload_module_if_needed(true, [], \'/project\', self.data_packages_js);',
'      var Module = await self.pipeline.Module;',
'      var FS = Module.FS;',
'      var PATH = Module.PATH;',
'',
'      var tex_path = main_tex_path.split(\'/\').pop();',
'      var dirname = main_tex_path.split(\'/\').slice(0, -1).join(\'/\');',
'',
'      // Mount fresh MEMFS',
'      try {',
'        if (FS.analyzePath(\'/project\').object.mount.mountpoint === \'/project\')',
'          FS.unmount(\'/project\');',
'      } catch(e) {}',
'      FS.mount(FS.filesystems.MEMFS, {}, \'/project\');',
'',
'      // Write all project files',
'      var dirs = {}; dirs[\'/\'] = true; dirs[\'/project\'] = true;',
'      function mkdirP(abs) {',
'        var parts = abs.replace(/^\\/+/, \'\').split(\'/\');',
'        var p = \'/project\';',
'        for (var i = 0; i < parts.length; i++) {',
'          p += \'/\' + parts[i];',
'          if (!dirs[p]) { try { FS.mkdir(p); } catch(e) {} dirs[p] = true; }',
'        }',
'      }',
'      for (var i = 0; i < files.length; i++) {',
'        var f = files[i];',
'        var abs = PATH.join(\'/project\', f.path);',
'        if (f.contents == null) {',
'          mkdirP(abs);',
'        } else {',
'          mkdirP(PATH.dirname(abs));',
'          FS.writeFile(abs, f.contents);',
'        }',
'      }',
'',
'      var sourceDir = PATH.join(\'/project\', dirname);',
'      FS.chdir(sourceDir);',
'',
'      // Build command templates',
'      var fmt = self.pipeline.fmt.xetex;',
'      var xelatex = [\'xelatex\', \'--no-shell-escape\', \'--interaction=batchmode\',',
'        \'--halt-on-error\', \'--no-pdf\', \'--fmt\', fmt, tex_path];',
'      var xdvipdfmx = [\'xdvipdfmx\', \'-o\',',
'        tex_path.replace(/\.tex$/, \'.pdf\'),',
'        tex_path.replace(/\.tex$/, \'.xdv\')];',
'',
'      // latexmk-style loop: run until .aux stabilises',
'      var MAX_PASSES = 5;',
'      var prevHash = null;',
'      var exitCode = 0;',
'      var allLogs = [];',
'',
'      for (var pass = 0; pass < MAX_PASSES; pass++) {',
'        postMessage({type: \'print\', text: \'XeLaTeX pass \' + (pass + 1) + \'...\'});',
'',
'        // Remove stale log file',
'        try { FS.unlink(tex_path.replace(/\.tex$/, \'.log\')); } catch(e) {}',
'',
'        var r = Module.callMainWithRedirects(xelatex, false);',
'        exitCode = r.exit_code;',
'        allLogs.push(\'$ \' + xelatex.join(\' \') + \'\\nEXITCODE: \' + exitCode + \'\\n\\n\' + r.stdout + \'\\n\' + r.stderr);',
'',
'        if (exitCode !== 0) {',
'          postMessage({type: \'print\', text: \'XeLaTeX pass \' + (pass + 1) + \' failed (exit \' + exitCode + \').\'});',
'          break;',
'        }',
'',
'        // Read .aux, compute hash to detect stability',
'        var auxContent = \'\';',
'        try {',
'          auxContent = FS.readFile(tex_path.replace(/\.tex$/, \'.aux\'), {encoding: \'utf8\'});',
'        } catch(e) {}',
'        var hash = 0;',
'        for (var j = 0; j < auxContent.length; j++) {',
'          hash = ((hash << 5) - hash + auxContent.charCodeAt(j)) | 0;',
'        }',
'        hash = hash + \'\';',
'',
'        if (pass > 0 && hash === prevHash) {',
'          postMessage({type: \'print\', text: \'Stable after \' + (pass + 1) + \' passes.\'});',
'          break;',
'        }',
'        prevHash = hash;',
'      }',
'',
'      // Convert to PDF',
'      var pdf = null;',
'      if (exitCode === 0) {',
'        postMessage({type: \'print\', text: \'xdvipdfmx: generating PDF...\'});',
'        var r2 = Module.callMainWithRedirects(xdvipdfmx, false);',
'        exitCode = r2.exit_code;',
'        allLogs.push(\'$ \' + xdvipdfmx.join(\' \') + \'\\nEXITCODE: \' + exitCode + \'\\n\\n\' + r2.stdout + \'\\n\' + r2.stderr);',
'',
'        if (exitCode === 0) {',
'          try {',
'            pdf = FS.readFile(tex_path.replace(/\.tex$/, \'.pdf\'), {encoding: \'binary\'});',
'          } catch(e) {',
'            postMessage({type: \'print\', text: \'Error reading PDF output.\'});',
'          }',
'        }',
'      }',
'',
'      postMessage({',
'        type: \'done\',',
'        pdf: pdf,',
'        log: allLogs.join(\'\\n\\n======\\n\\n\'),',
'        exit_code: exitCode,',
'        logs: allLogs',
'      });',
'',
'    } catch (err) {',
'      postMessage({type: \'error\', text: \'Compile error: \' + err.message + \'\\n\' + err.stack});',
'    }',
'  }',
'};'
    ].join('\n');
  }  function getOrCreateWorker() {
    if (worker) return worker;
    const code = makeWorkerCode();
    const blob = new Blob([code], {type: 'application/javascript'});
    const url = URL.createObjectURL(blob);
    worker = new Worker(url);
    return worker;
  }

  function terminateWorker() {
    if (worker) { worker.terminate(); worker = null; }
  }

  // ===== Compilation =====
  $btn.addEventListener('click', async () => {
    $btn.disabled = true;
    $progBar.classList.add('visible');
    setProgress(0);
    $log.textContent = ''; $log.classList.remove('visible');
    setStatus('Initializing BusyTeX compiler (first run ~120 MB download)…');

    let logs = [];

    try {
      const w = getOrCreateWorker();

      // Initialize pipeline
      w.postMessage({action: 'init'});
      await new Promise((resolve, reject) => {
        const onMsg = (e) => {
          const d = e.data;
          if (d.type === 'error') { w.removeEventListener('message', onMsg); reject(new Error(d.text)); return; }
          if (d.type === 'print') { logs.push(d.text); setStatus(d.text); }
          if (d.type === 'initialized') { w.removeEventListener('message', onMsg); resolve(); }
        };
        w.addEventListener('message', onMsg);
      });

      setStatus('Reading project files…');
      setProgress(20);

      // Build files array for BusyTeX
      const files = [];
      const BINARY_RE = /\.(png|jpe?g|gif|bmp|pdf|ttf|otf|woff2?)$/i;
      for (const [relPath, bytes] of Object.entries(fileMap)) {
        const isBinary = BINARY_RE.test(relPath);
        files.push({
          path: relPath,
          contents: isBinary ? bytes : new TextDecoder().decode(bytes)
        });
      }

      setStatus('Compiling (XeLaTeX, multi-pass)...');
      setProgress(25);
      logAppend('=== BusyTeX compilation started ===');

      w.postMessage({
        action: 'compile',
        files: files,
        main_tex_path: masterFile,
        verbose: 'verbose'
      });

      // Track milestones for live progress
      let lastPassSeen = 0;

      const result = await new Promise((resolve, reject) => {
        const onMsg = (e) => {
          const d = e.data;
          if (d.type === 'error') { w.removeEventListener('message', onMsg); reject(new Error(d.text)); return; }

          if (d.type === 'print') {
            logs.push(d.text);
            const line = d.text.trim();
            if (!line) { /* skip empty */ }

            // Data-package preloading messages
            else if (/Preparing|download|initialized/i.test(line)) {
              setStatus(line);
            }

            // Multi-pass: XeLaTeX pass N...
            else if (/^XeLaTeX pass (\d+)\.\.\.$/.test(line)) {
              const p = parseInt(line.match(/^XeLaTeX pass (\d+)\.\.\.$/)[1], 10);
              lastPassSeen = p;
              setStatus('XeLaTeX: pass ' + p + '...');
              setProgress(25 + Math.min(60, (p - 1) * 12));
            }

            // Stable after N passes
            else if (/^Stable after (\d+) passes\.$/.test(line)) {
              setStatus('Stable after ' + line.match(/^Stable after (\d+) passes\.$/)[1] + ' passes.');
              setProgress(88);
            }

            // xdvipdfmx: generating PDF
            else if (/^xdvipdfmx: generating PDF/.test(line)) {
              setStatus('Generating PDF...');
              setProgress(92);
            }

            // XeLaTeX pass N failed
            else if (/^XeLaTeX pass \d+ failed/.test(line)) {
              setStatus(line);
            }
          }

          if (d.type === 'done') { w.removeEventListener('message', onMsg); resolve(d); }
        };
        w.addEventListener('message', onMsg);
      });

      setProgress(100);
      logAppend(result.log);

      if (result.exit_code !== 0 || !result.pdf || result.pdf.length === 0) {
        setStatus('Compilation failed (exit ' + result.exit_code + '). See log below.', 'err');
        $btn.disabled = false;
        return;
      }

      setStatus('Done!', 'ok');
      const blob = new Blob([result.pdf], { type: 'application/pdf' });
      const url  = URL.createObjectURL(blob);
      const outName = (masterFile.split('/').pop() || 'output').replace(/\.tex$/i, '.pdf');

      $stage1.style.display = 'none';
      $stage2.style.display = '';
      $result.innerHTML = '<div id="pdfPages" style="max-height:70vh;overflow:auto;background:#525659;padding:8px 0;border-radius:6px"></div><div style="margin-top:.75rem"><a class="dl" href="' + url + '" download="' + outName + '">Download ' + outName + '</a><button class="secondary" id="backBtn">↺ Back</button></div>';
      renderLatexPdf(result.pdf, document.getElementById('pdfPages'));
      document.getElementById('backBtn').addEventListener('click', () => {
        $stage2.style.display = 'none';
        $stage1.style.display = '';
        $btn.disabled = false;
      });

    } catch (e) {
      setStatus('Error: ' + (e && e.message || e), 'err');
      logAppend(logs.join('\n'));
      $btn.disabled = false;
    } finally {
      $progBar.classList.remove('visible');
    }
  });

  $clear.addEventListener('click', () => {
    fileMap = {}; masterFile = '';
    $tree.innerHTML = ''; $actions.style.display = 'none';
    $status.textContent = ''; $status.className = '';
    $log.textContent = ''; $log.classList.remove('visible');
    $result.innerHTML = '';
    $stage1.style.display = ''; $stage2.style.display = 'none';
    terminateWorker();
    $path.textContent = '(cleared)';
  });

  function getProjectPath() {
    const hash = location.hash;
    const m = hash.match(/[#&?]project=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  const initialPath = getProjectPath();
  if (initialPath) loadProject(initialPath);
  else $path.textContent = 'No project selected. Open a .tex file from the file browser.';

  window.addEventListener('hashchange', () => {
    const p = getProjectPath();
    if (p) loadProject(p);
  });
})();
</script>
<script>
window.renderLatexPdf = async function (bytes, container) {
  if (!window.__pdfjsP) {
    window.__pdfjsP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = '/modules/pdf.min.js'; s.onload = res; s.onerror = () => rej(new Error('pdf.js load failed')); document.head.appendChild(s); })
      .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/modules/pdf.worker.min.js'; });
  }
  try {
    await window.__pdfjsP;
    const data = (bytes instanceof Uint8Array) ? bytes : new Uint8Array(bytes);
    const doc = await window.pdfjsLib.getDocument({ data: data.slice(0) }).promise;
    container.innerHTML = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = (container.clientWidth || 800) - 16;
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.max(0.2, cw / base.width);
      const vp = page.getViewport({ scale: scale * dpr });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      c.style.cssText = 'display:block;margin:0 auto 8px;width:' + Math.round(vp.width / dpr) + 'px;max-width:100%;box-shadow:0 1px 4px rgba(0,0,0,.4);background:#fff';
      container.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) {
    container.innerHTML = '<div style="color:#f85149;padding:1rem">Preview failed: ' + (e && e.message || e) + '. Use the Download link.</div>';
  }
};
</script>
</body>
</html>
