<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandpie — LaTeX to PDF</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 1rem;
  }
  .card {
    width: 100%; max-width: 700px;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 1.5rem 1.75rem;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.1rem; color: #e6edf3; margin: 0 0 .75rem; }
  #projectPath { font-family: ui-monospace,monospace; color: #8b949e; margin-bottom: 1rem; }
  #filetree { margin-top: .75rem; max-height: 220px; overflow-y: auto; border: 1px solid #30363d; border-radius: 6px; padding: .5rem; }
  #filetree ul { list-style: none; padding: 0; margin: .25rem 0; }
  #filetree li { font-size: .85rem; color: #8b949e; padding: .15rem 0; }
  #filetree li.master { color: #58a6ff; font-weight: 600; }
  #filetree li::before { content: "📄 "; }
  #filetree li.dir::before { content: "📁 "; }
  button.primary {
    background: #238636; color: #fff; border: 0; border-radius: 6px;
    padding: .5rem 1.25rem; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #30363d; cursor: not-allowed; }
  button.secondary {
    background: #30363d; color: #c9d1d9; border: 0; border-radius: 6px;
    padding: .45rem 1rem; font-size: .85rem; cursor: pointer; margin-left: .5rem;
  }
  #status { min-height: 2em; color: #8b949e; margin-top: .75rem; white-space: pre-wrap; }
  #status.err { color: #f85149; }
  #status.ok  { color: #3fb950; }
  #result { margin-top: .75rem; }
  #logpanel {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    margin-top: .75rem; max-height: 250px; overflow-y: auto;
    font-family: ui-monospace, monospace; font-size: .78rem;
    white-space: pre-wrap; padding: .75rem; color: #8b949e;
    display: none;
  }
  #logpanel.visible { display: block; }
  iframe { width: 100%; height: 60vh; border: 1px solid #30363d; border-radius: 6px; }
  .hint { font-size: .8rem; color: #6e7681; margin-top: 1rem; }
  .actions { margin-top: 1rem; }
  a.dl {
    display: inline-block; background: #238636; color: #fff;
    text-decoration: none; padding: .5rem 1.25rem; border-radius: 6px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="card" id="stage1">
  <h1>LaTeX → PDF</h1>
  <div id="projectPath">(no project selected)</div>
  <div id="filetree"></div>
  <div class="actions" id="actions" style="display:none">
    <button class="primary" id="compileBtn" disabled>Compile</button>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>
  <div id="status"></div>
  <div id="logpanel"></div>
</div>

<div class="card" id="stage2" style="display:none">
  <h1>Result</h1>
  <div id="result"></div>
  <div class="hint">Powered by <a href="https://swiftlatex.com" target="_blank" style="color:#8b949e">SwiftLaTeX</a> — runs entirely in your browser.</div>
</div>

<script src="vendor/XeTeXEngine.js"></script>
<script>
(() => {
  'use strict';

  const $path    = document.getElementById('projectPath');
  const $tree    = document.getElementById('filetree');
  const $actions = document.getElementById('actions');
  const $btn     = document.getElementById('compileBtn');
  const $clear   = document.getElementById('clearBtn');
  const $status  = document.getElementById('status');
  const $log     = document.getElementById('logpanel');
  const $stage1  = document.getElementById('stage1');
  const $stage2  = document.getElementById('stage2');
  const $result  = document.getElementById('result');

  let fileMap   = {}; // path -> Uint8Array
  let masterFile = '';
  let engine     = null;

  const status = (msg, cls) => { $status.textContent = msg; $status.className = cls || ''; };
  const logAppend = (txt) => { $log.textContent += txt + '\n'; $log.classList.add('visible'); };

  // ===== OPFS helpers =====
  async function getDb() {
    return await navigator.storage.getDirectory();
  }

  async function resolveDir(parts) {
    let dir = await getDb();
    for (const p of parts) {
      dir = await dir.getDirectoryHandle(p, { create: false });
    }
    return dir;
  }

  async function walkDir(dir, prefix, out) {
    for await (const [name, handle] of dir.entries()) {
      const full = prefix ? prefix + '/' + name : name;
      if (handle.kind === 'directory') {
        out.dirs.push(full);
        if (name === 'node_modules' || name === '.git' || name.startsWith('.')) continue;
        await walkDir(handle, full, out);
      } else {
        out.files.push(full);
        if (name.endsWith('.tex')) out.texFiles.push(full);
      }
    }
  }

  async function readFileBytes(path) {
    const parts = path.split('/');
    const name = parts.pop();
    const dir = await resolveDir(parts);
    const fh = await dir.getFileHandle(name);
    const f = await fh.getFile();
    return new Uint8Array(await f.arrayBuffer());
  }

  async function readFileText(path, maxBytes = 4096) {
    const buf = await readFileBytes(path);
    const len = Math.min(buf.length, maxBytes);
    return new TextDecoder().decode(buf.slice(0, len));
  }

  // ===== Project loading =====
  async function loadProject(projectPath) {
    if (!projectPath) { status('No project specified.', 'err'); return; }
    fileMap = {};
    masterFile = '';
    $path.textContent = '/' + projectPath;
    status('Scanning project…');

    try {
      const rootDir = await resolveDir(projectPath.split('/').filter(Boolean));
      const out = { files: [], dirs: [], texFiles: [] };
      await walkDir(rootDir, '', out);

      // Read all .tex file contents for master detection
      const texContents = {};
      for (const p of out.texFiles) {
        texContents[p] = await readFileText(projectPath + '/' + p, 8192);
        fileMap[p] = await readFileBytes(projectPath + '/' + p);
      }

      // Read non-.tex files lazily (for the compile step)
      for (const p of out.files) {
        if (!p.endsWith('.tex')) {
          fileMap[p] = await readFileBytes(projectPath + '/' + p);
        }
      }

      // Auto-detect master file: prefers main.tex, then first with \documentclass
      for (const p of out.texFiles) {
        if (/\bmain\.tex$/i.test(p)) { masterFile = p; break; }
      }
      if (!masterFile) {
        for (const p of out.texFiles) {
          if (/\\\s*documentclass\s*[\[{]/m.test(texContents[p])) { masterFile = p; break; }
        }
      }
      if (!masterFile && out.texFiles.length) {
        masterFile = out.texFiles[0];
      }

      renderTree(out);
      $actions.style.display = '';
      $btn.disabled = !masterFile;
      status(masterFile ? `Found master: /${projectPath}/${masterFile}` : 'No master file found (need \\documentclass).', masterFile ? 'ok' : 'err');
    } catch (e) {
      status('Error loading project: ' + (e && e.message), 'err');
    }
  }

  function renderTree(out) {
    const html = ['<ul>'];
    for (const p of out.files.sort()) {
      const isMaster = p === masterFile;
      html.push(`<li class="${isMaster ? 'master' : ''}">${p}</li>`);
    }
    html.push('</ul>');
    $tree.innerHTML = html.join('');
  }

  // ===== Compilation =====
  $btn.addEventListener('click', async () => {
    $btn.disabled = true;
    $log.textContent = '';
    status('Loading XeTeX engine…');

    try {
      if (!engine) {
        engine = new XeTeXEngine();
        await engine.loadEngine();
      }
      status('Writing files to virtual FS…');

      // Verify master by scanning for \documentclass
      const projectPath = getProjectPath();
      const masterText = await readFileText(projectPath + '/' + masterFile, 8192);
      if (!/^\s*\\\s*documentclass\s*[\[{]/m.test(masterText)) {
        status('Selected file does not contain \\documentclass. Scanning others…');
        const out = { files: [], dirs: [], texFiles: [] };
        const rootDir = await resolveDir(projectPath.split('/').filter(Boolean));
        await walkDir(rootDir, '', out);
        let found = false;
        for (const p of out.texFiles) {
          const text = await readFileText(projectPath + '/' + p, 8192);
          if (/^\s*\\\s*documentclass\s*[\[{]/m.test(text)) { masterFile = p; found = true; break; }
        }
        if (!found) { status('No master file with \\documentclass found.', 'err'); $btn.disabled = false; return; }
      }

      engine.flushCache();
      for (const [path, bytes] of Object.entries(fileMap)) {
        engine.writeMemFSFile(path, bytes);
      }
      engine.setEngineMainFile(masterFile);

      status('Compiling (may download packages on first run)…');
      const res = await engine.compileLaTeX();

      if (res.status !== 0 || !res.pdf) {
        logAppend(res.log);
        status('Compilation failed. See log below.', 'err');
        $btn.disabled = false;
        return;
      }

      logAppend(res.log);
      status('Done!', 'ok');

      const blob = new Blob([res.pdf], { type: 'application/pdf' });
      const url  = URL.createObjectURL(blob);
      const outName = (masterFile.split('/').pop() || 'output').replace(/\.tex$/i, '.pdf');

      $stage1.style.display = 'none';
      $stage2.style.display = '';
      $result.innerHTML = `
        <iframe src="${url}" type="application/pdf"></iframe>
        <div style="margin-top:.75rem">
          <a class="dl" href="${url}" download="${outName}">Download ${outName}</a>
          <button class="secondary" id="backBtn">↺ Back</button>
        </div>
      `;
      document.getElementById('backBtn').addEventListener('click', () => {
        $stage2.style.display = 'none';
        $stage1.style.display = '';
        $btn.disabled = false;
      });

    } catch (e) {
      status('Error: ' + (e && e.message || e), 'err');
      $btn.disabled = false;
    }
  });

  $clear.addEventListener('click', () => {
    fileMap = {}; masterFile = '';
    $tree.innerHTML = ''; $actions.style.display = 'none';
    $status.textContent = ''; $status.className = '';
    $log.textContent = ''; $log.classList.remove('visible');
    $result.innerHTML = '';
    $stage1.style.display = ''; $stage2.style.display = 'none';
    if (engine) { try { engine.closeWorker(); } catch (_) {} engine = null; }
    $path.textContent = '(cleared)';
  });

  function getProjectPath() {
    const hash = location.hash;
    const m = hash.match(/[#&?]project=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  // Auto-load if project is specified
  const initialPath = getProjectPath();
  if (initialPath) {
    loadProject(initialPath);
  } else {
    $path.textContent = 'No project selected. Open a .tex file from the file browser.';
  }

  // Re-load on hash change (e.g. user opens a different project)
  window.addEventListener('hashchange', () => {
    const p = getProjectPath();
    if (p) loadProject(p);
  });
})();
</script>
</body>
</html>
