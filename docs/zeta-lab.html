<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZetaOffice convert lab</title>
<!-- Local-only evaluation harness for ZetaOffice/zetajs (allotropia's official
     LibreOffice-WASM) as a replacement conversion engine. Assets come from
     cdn.zetaoffice.net (CORS *). Needs COI like any pthread'd LOWA build. -->
<script src="coi-serviceworker.js"></script>
</head>
<body style="background:#111;color:#ccc;font:13px monospace;padding:1rem">
<div id="out">booting…</div>
<canvas id="qtcanvas" style="display:none"></canvas>
<script type="module">
import { ZetaHelperMain } from './zeta/zetaHelper.js';

const out = document.getElementById('out');
const say = (m) => { out.textContent = m; console.log('[zeta-lab]', m); };
if (!crossOriginIsolated) { say('waiting for COI reload…'); }
else {
  const t0 = Date.now();
  say('loading ZetaOffice from CDN…');
  const zHM = new ZetaHelperMain('zeta-thread.js', { threadJsType: 'module', wasmPkg: 'free' });
  const pending = new Map();
  let seq = 0;

  window.zetaBootMs = null;
  // Convert a same-origin URL to PDF; returns {ok, size, magic, ms} or {ok:false, error}.
  window.zetaConvert = (url, ext = 'docx', timeoutMs = 120000) => new Promise(async (resolve) => {
    const bytes = new Uint8Array(await (await fetch(url)).arrayBuffer());
    const from = '/tmp/input.' + ext, to = '/tmp/output';
    zHM.FS.writeFile(from, bytes);
    const id = 'c' + (++seq);
    const t = Date.now();
    const timer = setTimeout(() => { pending.delete(id); resolve({ ok: false, error: 'TIMEOUT', ms: Date.now() - t }); }, timeoutMs);
    pending.set(id, (msg) => {
      clearTimeout(timer);
      if (msg.cmd === 'error') { resolve({ ok: false, error: msg.error, ms: Date.now() - t }); return; }
      try {
        const data = zHM.FS.readFile(to);
        const magic = new TextDecoder().decode(data.slice(0, 8));
        try { zHM.FS.unlink(from); } catch (_) {}
        try { zHM.FS.unlink(to); } catch (_) {}
        resolve({ ok: true, size: data.length, magic, ms: Date.now() - t });
      } catch (e) { resolve({ ok: false, error: 'read output: ' + e.message, ms: Date.now() - t }); }
    });
    zHM.thrPort.postMessage({ cmd: 'convert', id, from, to });
  });

  zHM.start(() => {
    zHM.thrPort.onmessage = (e) => {
      const d = e.data;
      if (d.cmd === 'ready') {
        window.zetaBootMs = Date.now() - t0;
        say('ZetaOffice ready in ' + window.zetaBootMs + ' ms');
        return;
      }
      const cb = pending.get(d.id);
      if (cb) { pending.delete(d.id); cb(d); }
    };
  });
}
</script>
</body>
</html>
