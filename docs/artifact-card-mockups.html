<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artifact card mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sandpie.css?v=41">
<style>
  body { background: var(--sp-bg); color: var(--sp-text); font-family: 'Outfit', system-ui, sans-serif; padding: 28px; max-width: 760px; margin: 0 auto; }
  h2 { font: 600 13px/1 'Space Grotesk', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--sp-text-dim); margin: 34px 0 12px; border-bottom: 1px solid var(--sp-border); padding-bottom: 8px; }
  h2:first-child { margin-top: 0; }
  .note { font-size: 12px; color: var(--sp-text-dim); margin: 0 0 14px; }
  .row { display: flex; flex-direction: column; gap: 12px; }

  /* shared icon tile */
  .ic { flex: none; display: grid; place-items: center; border-radius: 8px; }
  .ic svg { width: 22px; height: 22px; }
  .t-doc  { background: rgba(88,166,255,.14); color: #58a6ff; }
  .t-xls  { background: rgba(63,185,80,.15);  color: #3fb950; }
  .t-ppt  { background: rgba(219,109,64,.15); color: #db6d40; }
  .t-pdf  { background: rgba(248,81,73,.15);  color: #f85149; }
  .t-code { background: rgba(163,113,247,.16);color: #a371f7; }

  /* ---- V0 current ---- */
  .v0 { border:1px solid var(--sp-border); border-radius:4px; overflow:hidden; }
  .v0 .hd { padding:2px 8px; font:11px monospace; color:var(--sp-text-dim); background:var(--sp-panel); border-bottom:1px solid var(--sp-border); }
  .v0 .bd { padding:16px 14px; font:12px monospace; color:var(--sp-text-dim); text-align:center; }
  .v0 button { margin-top:6px; padding:4px 12px; font:12px monospace; background:var(--sp-accent); color:#fff; border:none; border-radius:3px; cursor:pointer; }

  /* ---- V1 clickable card ---- */
  .v1 { display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--sp-border); border-radius:10px; background:var(--sp-panel); cursor:pointer; transition:border-color .12s, background .12s; }
  .v1:hover { border-color:var(--sp-accent); background:color-mix(in srgb, var(--sp-accent) 7%, var(--sp-panel)); }
  .v1 .ic { width:40px; height:40px; }
  .v1 .meta { flex:1; min-width:0; }
  .v1 .nm { font:500 14px/1.3 'Space Grotesk', sans-serif; color:var(--sp-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v1 .sub { font-size:11.5px; color:var(--sp-text-dim); margin-top:1px; }
  .v1 .go { flex:none; color:var(--sp-text-dim); font-size:18px; transition:color .12s, transform .12s; }
  .v1:hover .go { color:var(--sp-accent); transform:translateX(2px); }

  /* ---- V2 preview-thumbnail card ---- */
  .v2 { border:1px solid var(--sp-border); border-radius:10px; overflow:hidden; background:var(--sp-panel); cursor:pointer; transition:border-color .12s; }
  .v2:hover { border-color:var(--sp-accent); }
  .v2 .thumb { height:96px; background:var(--sp-bg); display:grid; place-items:center; border-bottom:1px solid var(--sp-border); position:relative; overflow:hidden; }
  .v2 .page { width:120px; background:#fdfdfd; border-radius:3px 3px 0 0; padding:11px 12px 0; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .v2 .page i { display:block; height:4px; border-radius:2px; background:#c9d3de; margin-bottom:5px; }
  .v2 .page i.s { width:55%; } .v2 .page i.m { width:82%; } .v2 .page i.t { width:38%; background:#58a6ff; height:6px; margin-bottom:8px; }
  .v2 .ft { display:flex; align-items:center; gap:10px; padding:9px 12px; }
  .v2 .ic { width:28px; height:28px; } .v2 .ic svg { width:16px; height:16px; }
  .v2 .nm { font:500 13px 'Space Grotesk', sans-serif; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v2 .sub { font-size:11px; color:var(--sp-text-dim); }

  /* ---- V3 compact bar ---- */
  .v3 { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--sp-border); border-left:3px solid var(--sp-accent); border-radius:0 7px 7px 0; background:var(--sp-panel); }
  .v3 .ic { width:30px; height:30px; } .v3 .ic svg { width:17px; height:17px; }
  .v3 .nm { font:500 13px 'Space Grotesk', sans-serif; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v3 .sub { font-size:11px; color:var(--sp-text-dim); }
  .v3 .open { flex:none; font:600 11px 'Space Grotesk', sans-serif; letter-spacing:.04em; padding:5px 12px; border-radius:999px; background:var(--sp-accent); color:#0d1117; border:none; cursor:pointer; }

  /* ---- V4 cyber/glow ---- */
  .v4 { position:relative; display:flex; align-items:center; gap:13px; padding:13px 15px; border:1px solid var(--sp-accent-dim); border-radius:8px; background:linear-gradient(180deg, color-mix(in srgb,var(--sp-accent) 6%,var(--sp-panel)), var(--sp-panel)); cursor:pointer; overflow:hidden; }
  .v4::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--sp-accent); box-shadow:0 0 10px var(--sp-accent); }
  .v4 .ic { width:38px; height:38px; box-shadow:0 0 0 1px var(--sp-accent-dim); }
  .v4 .nm { font:600 14px 'Orbitron', sans-serif; letter-spacing:.02em; }
  .v4 .sub { font:11px 'Space Grotesk', monospace; color:var(--sp-text-dim); letter-spacing:.05em; margin-top:2px; }
  .v4 .meta { flex:1; min-width:0; }
  .v4 .open { flex:none; font:600 11px 'Space Grotesk', monospace; letter-spacing:.08em; text-transform:uppercase; padding:6px 13px; border-radius:5px; background:transparent; color:var(--sp-accent); border:1px solid var(--sp-accent); cursor:pointer; }
</style>
</head>
<body>
<script>
  const ICONS = {
    doc:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><line x1="9" y1="9" x2="10" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>',
    xls:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13l6 5M15 13l-6 5"/></svg>',
    ppt:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><rect x="9" y="12" width="6" height="4" rx="1"/></svg>',
    pdf:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 17v-4h1.5a1.5 1.5 0 0 1 0 3H9"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M10 12l-2 2 2 2M14 12l2 2-2 2"/></svg>',
  };
  function tile(kind, cls) { return '<div class="ic t-'+cls+'">'+ICONS[kind]+'</div>'; }

  document.body.insertAdjacentHTML('beforeend', `
  <h2>V0 · current</h2>
  <div class="note">what ships today — a label and a plain button.</div>
  <div class="row"><div class="v0"><div class="hd">📎 Artifact — offer_template.docx</div><div class="bd">📘 Word document<br><button>▶ View</button></div></div></div>

  <h2>V1 · clickable card</h2>
  <div class="note">whole card opens it; icon tile is color-coded per type; hover shows accent + arrow nudge.</div>
  <div class="row">
    <div class="v1">${tile('doc','doc')}<div class="meta"><div class="nm">Plantilla_word_ofertes_projectes_3.docx</div><div class="sub">Word document · 161 KB</div></div><div class="go">›</div></div>
    <div class="v1">${tile('xls','xls')}<div class="meta"><div class="nm">q3_budget.xlsx</div><div class="sub">Spreadsheet · 44 KB</div></div><div class="go">›</div></div>
  </div>

  <h2>V2 · preview thumbnail</h2>
  <div class="note">Claude-style — a faux page preview on top, footer with icon + name. Most "artifact-like".</div>
  <div class="row">
    <div class="v2"><div class="thumb"><div class="page"><i class="t"></i><i class="m"></i><i class="s"></i><i class="m"></i><i class="s"></i></div></div><div class="ft">${tile('doc','doc')}<div class="nm">offer_template.docx</div><span class="sub">Word · 161 KB</span></div></div>
    <div class="v2"><div class="thumb"><div class="page"><i class="t"></i><i class="m"></i><i class="s"></i><i class="m"></i><i class="s"></i></div></div><div class="ft">${tile('ppt','ppt')}<div class="nm">pitch_deck.pptx</div><span class="sub">Slides · 2.1 MB</span></div></div>
  </div>

  <h2>V3 · compact bar</h2>
  <div class="note">minimal height; accent left-edge; pill button on the right. Good when many artifacts stack.</div>
  <div class="row">
    <div class="v3">${tile('pdf','pdf')}<div><div class="nm">report.pdf</div></div><span class="sub" style="flex:1"></span><button class="open">Open</button></div>
    <div class="v3">${tile('doc','doc')}<div class="nm">offer_template.docx</div><button class="open">Open</button></div>
  </div>

  <h2>V4 · cyber / glow</h2>
  <div class="note">leans into sandpie's aesthetic — Orbitron title, glowing accent edge, outlined open button.</div>
  <div class="row">
    <div class="v4">${tile('doc','doc')}<div class="meta"><div class="nm">offer_template.docx</div><div class="sub">WORD DOCUMENT · 161 KB</div></div><button class="open">▶ Open</button></div>
    <div class="v4">${tile('code','code')}<div class="meta"><div class="nm">dashboard.html</div><div class="sub">WEB PAGE · 8 KB</div></div><button class="open">▶ Open</button></div>
  </div>
  `);
</script>
</body>
</html>
