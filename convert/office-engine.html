<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sandpie office engine</title>
<!-- Headless office→PDF engine, embedded as a hidden same-origin iframe by the
     sandpie app (modules/opfs.js opfs._officeEngine). Runs ZetaOffice (LibreOffice
     WASM) via vendored zetajs. Requires the embedding top-level page to be
     crossOriginIsolated (SharedArrayBuffer) — true in prod (server COOP/COEP) and
     under the local coiserver.py. postMessage protocol with the parent:
       parent → engine:  {type:'convert', id, bytes:ArrayBuffer, ext}
       engine → parent:  {type:'engine-ready'} | {type:'engine-error', error}
                         {type:'converted-ok', id, pdf:ArrayBuffer}
                         {type:'converted-err', id, error}
     Also runnable stand-alone (via convert/index.html's flow) for non-COI fallback,
     but its normal home is the in-app hidden iframe. -->
</head>
<body>
<canvas id="qtcanvas" style="display:none"></canvas>
<script type="module">
import { ZetaHelperMain } from './zeta/zetaHelper.js';

// Module-specific PDF export filters, keyed by input extension. Using the wrong
// module's filter (e.g. writer_pdf_Export on a spreadsheet) makes storeToURL fail.
const EXT_FILTER = {
  docx: 'writer_pdf_Export', doc: 'writer_pdf_Export', odt: 'writer_pdf_Export',
  rtf: 'writer_pdf_Export', txt: 'writer_pdf_Export',
  xlsx: 'calc_pdf_Export', xls: 'calc_pdf_Export', ods: 'calc_pdf_Export', csv: 'calc_pdf_Export',
  pptx: 'impress_pdf_Export', ppt: 'impress_pdf_Export', odp: 'impress_pdf_Export',
  odg: 'draw_pdf_Export',
};
const target = () => (window.parent && window.parent !== window ? window.parent : window);
const post = (msg, transfer) => target().postMessage(msg, '*', transfer || []);

if (!crossOriginIsolated) {
  post({ type: 'engine-error', error: 'office-engine: page is not cross-origin isolated' });
} else {
  // Load the LibreOffice WASM through our OWN origin via the same-origin /proxy/
  // instead of hitting cdn.zetaoffice.net directly. The CDN sends CORS headers but
  // no Cross-Origin-Resource-Policy, so under COEP it only loads on browsers that
  // support `credentialless` (desktop Chrome). Mobile (iOS Safari, etc.) refuses
  // the cross-origin fetch → "refused to connect" and a dead converter. Routing
  // through same-origin /proxy/ sidesteps COEP entirely and always tracks the CDN's
  // current build (the vendored convert/wasm/ copy is a stale, mismatched build).
  // /proxy/ is auth-gated, but in-app requests are same-origin and carry the session
  // cookie, so they authorize. Same fix applies to the LaTeX engine (texlive host).
  const zHM = new ZetaHelperMain('office-thread.js', { threadJsType: 'module', wasmPkg: 'url:/proxy/cdn.zetaoffice.net/zetaoffice_latest/' });
  const pending = new Map();
  let seq = 0;

  // Inject user fonts (OPFS sandpie/fonts/*.ttf|otf|ttc) into LibreOffice's font
  // dir BEFORE the runtime scans fonts. Writing them after boot is too late — LO
  // has already built + cached its font list. window.Module exists (set by
  // ZetaHelperMain's ctor) before start() imports soffice.js, so we pre-read the
  // bytes and write them in an Emscripten preRun hook, which runs before main().
  let injectedFontCount = 0;
  try {
    const root = await navigator.storage.getDirectory();
    const sp = await root.getDirectoryHandle('sandpie').catch(() => null);
    const dir = sp ? await sp.getDirectoryHandle('fonts').catch(() => null) : null;
    const fonts = [];
    if (dir) for await (const [nm, h] of dir.entries()) {
      if (h.kind === 'file' && /\.(ttf|otf|ttc)$/i.test(nm)) {
        try { fonts.push({ name: nm.replace(/[^A-Za-z0-9._-]/g, '_'), bytes: new Uint8Array(await (await h.getFile()).arrayBuffer()) }); } catch (_) {}
      }
    }
    if (fonts.length && window.Module) {
      injectedFontCount = fonts.length;
      (window.Module.preRun = window.Module.preRun || []).push(function () {
        const FS = window.FS || (window.Module && window.Module.FS);
        const d = '/instdir/share/fonts/truetype';
        try { FS.mkdirTree ? FS.mkdirTree(d) : d.split('/').filter(Boolean).reduce((a, p) => { a += '/' + p; try { FS.mkdir(a); } catch (_) {} return a; }, ''); } catch (_) {}
        for (const f of fonts) { try { FS.writeFile(d + '/' + f.name, f.bytes); } catch (_) {} }
      });
    }
  } catch (_) {}

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'convert') return;
    const parentId = d.id;
    const ext = String(d.ext || 'docx').toLowerCase();
    const filter = EXT_FILTER[ext] || 'writer_pdf_Export';
    const from = '/tmp/input.' + ext, to = '/tmp/output.pdf';
    try {
      zHM.FS.writeFile(from, new Uint8Array(d.bytes));
    } catch (err) {
      post({ type: 'converted-err', id: parentId, error: 'write failed: ' + (err.message || err) });
      return;
    }
    const id = 'c' + (++seq);
    pending.set(id, (msg) => {
      if (msg.cmd === 'error') { post({ type: 'converted-err', id: parentId, error: msg.error }); return; }
      let data;
      try { data = zHM.FS.readFile(to); }
      catch (err) { post({ type: 'converted-err', id: parentId, error: 'read output failed: ' + (err.message || err) }); return; }
      try { zHM.FS.unlink(from); } catch (_) {}
      try { zHM.FS.unlink(to); } catch (_) {}
      const buf = data.buffer.slice(0);
      post({ type: 'converted-ok', id: parentId, pdf: buf }, [buf]);
    });
    zHM.thrPort.postMessage({ cmd: 'convert', id, from, to, filter });
  });

  zHM.start(() => {
    zHM.thrPort.onmessage = (e) => {
      const d = e.data;
      if (d.cmd === 'ready') { post({ type: 'engine-ready', fonts: injectedFontCount }); return; }
      const cb = pending.get(d.id);
      if (cb) { pending.delete(d.id); cb(d); }
    };
  });
}
</script>
</body>
</html>
