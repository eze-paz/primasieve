<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sandpie — PDF converter</title>
<!-- COI bootstrap: LibreOffice WASM is a pthreads (SharedArrayBuffer) build, so this
     page must be crossOriginIsolated. The main sandpie app deliberately runs WITHOUT
     COOP/COEP (and evicts any SW that controls it), so conversion happens here, in a
     dedicated popup whose coi-serviceworker is scoped to /convert/ only — it never
     touches the app page. The script reloads this page once after the SW takes control. -->
<script src="coi-serviceworker.js"></script>
<style>
  body { margin:0; background:#0d1117; color:#c9d1d9; font:15px/1.5 system-ui, sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { max-width:440px; width:90%; background:#161b22; border:1px solid #30363d;
          border-radius:10px; padding:1.5rem 1.75rem; }
  h1 { font-size:1.05rem; margin:0 0 .75rem; color:#e6edf3; }
  #status { min-height:3em; color:#8b949e; overflow-wrap:anywhere; }
  #status.err { color:#f85149; }
  progress { width:100%; height:8px; accent-color:#58a6ff; }
  a.dl { display:inline-block; margin-top:.75rem; padding:.45rem 1rem; border-radius:6px;
         background:#238636; color:#fff; text-decoration:none; font-weight:600; }
  .hint { font-size:.8rem; color:#6e7681; margin-top:1rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Convert to PDF</h1>
  <div id="status">Starting…</div>
  <progress id="bar" max="100" value="0" style="display:none"></progress>
  <div id="result"></div>
  <div class="hint">Runs LibreOffice fully in your browser — the document never leaves this tab.
    First run downloads ~77&nbsp;MB (cached afterwards).</div>
</div>
<script>
(async () => {
  const $status = document.getElementById('status');
  const $bar = document.getElementById('bar');
  const $result = document.getElementById('result');
  const status = (msg, err) => { $status.textContent = msg; $status.className = err ? 'err' : ''; };
  const bar = (pct) => { $bar.style.display = ''; $bar.value = pct; };

  // ── 1. Cross-origin isolation gate ──────────────────────────────────────
  // coi-serviceworker.js registers + reloads once; if we're still not isolated
  // after that (its sessionStorage guard is set), isolation is unavailable here.
  if (!crossOriginIsolated) {
    let retried = false;
    try { retried = !!sessionStorage.getItem('coiReloaded'); } catch (_) {}
    status(retried
      ? 'Could not enable cross-origin isolation (service worker blocked?). Conversion needs SharedArrayBuffer.'
      : 'Enabling cross-origin isolation — the page will reload once…', retried);
    return;
  }

  // ── 2. Pick up the job the app handed us via IndexedDB ──────────────────
  const jobId = new URLSearchParams(location.hash.slice(1)).get('job');
  if (!jobId) { status('No conversion job — open a document in sandpie and press "→ PDF".', true); return; }
  const idb = await new Promise((res, rej) => {
    const r = indexedDB.open('sandpie-convert', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('jobs', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const job = await new Promise((res, rej) => {
    const tx = idb.transaction('jobs', 'readwrite');
    const get = tx.objectStore('jobs').get(jobId);
    get.onsuccess = () => { if (get.result) tx.objectStore('jobs').delete(jobId); res(get.result); };
    get.onerror = () => rej(get.error);
  });
  if (!job) { status('Conversion job not found (expired?). Close this tab and press "→ PDF" again.', true); return; }
  document.title = 'Converting ' + job.name;

  // ── 3. Fetch LibreOffice WASM assets (blob URLs so the worker can load them) ─
  const BASE = 'https://cdn.jsdelivr.net/npm/@bentopdf/libreoffice-wasm@2.3.1/assets';
  async function fetchProgress(url, label) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('fetch ' + url + ' → ' + r.status);
    const total = +r.headers.get('Content-Length') || 0;
    if (!total || !r.body) return new Uint8Array(await r.arrayBuffer());
    const reader = r.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      status(`Downloading ${label}… ${(got / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`);
      bar(Math.round(got / total * 100));
    }
    const out = new Uint8Array(got); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }
  // Debug tap: workers' console output is invisible from the page, so a shim is
  // prepended to every worker script forwarding console.* + uncaught errors over
  // a BroadcastChannel. Buffered in window._loLogs for post-mortem inspection.
  const LOGS = []; window._loLogs = LOGS;
  new BroadcastChannel('sandpie-convert-debug').onmessage = (e) => {
    LOGS.push(e.data); if (LOGS.length > 3000) LOGS.shift();
  };
  const SHIM = "(()=>{try{const bc=new BroadcastChannel('sandpie-convert-debug');" +
    "const s=x=>{try{return typeof x==='string'?x:(x&&x.message)||JSON.stringify(x)}catch(_){return String(x)}};" +
    "['log','warn','error','info'].forEach(l=>{const o=console[l].bind(console);" +
    "console[l]=(...a)=>{try{bc.postMessage(l+': '+a.map(s).join(' '))}catch(_){}o(...a)}});" +
    "self.addEventListener('error',e=>{try{bc.postMessage('UNCAUGHT: '+e.message+' @ '+e.filename+':'+e.lineno)}catch(_){}});" +
    "self.addEventListener('unhandledrejection',e=>{try{bc.postMessage('REJECTION: '+s(e.reason))}catch(_){}});}catch(_){}})();\n";
  const gunzip = async (bytes, mime) => {
    const ds = new DecompressionStream('gzip');
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return URL.createObjectURL(new Blob([buf], { type: mime }));
  };
  const scriptBlob = async (url, prefix = '') =>
    URL.createObjectURL(new Blob([prefix + await (await fetch(url)).text()], { type: 'application/javascript' }));

  try {
    status('Downloading LibreOffice runtime…');
    const sofficeJs = await scriptBlob(BASE + '/soffice.js');
    const sofficeWorkerJs = await scriptBlob(BASE + '/soffice.worker.js', SHIM);
    const wasmGz = await fetchProgress(BASE + '/soffice.wasm.gz', 'engine (soffice.wasm)');
    status('Decompressing engine…');
    const sofficeWasm = await gunzip(wasmGz, 'application/wasm');
    const dataGz = await fetchProgress(BASE + '/soffice.data.gz', 'filesystem (soffice.data)');
    status('Decompressing filesystem…');
    const sofficeData = await gunzip(dataGz, 'application/octet-stream');
    const workerCode = await (await fetch(BASE + '/browser.worker.global.js')).text();

    // ── 4. Spawn the conversion worker and drive its message protocol ─────
    // LibreOffice's boot occasionally hits an Emscripten pthread-spawn deadlock
    // (timing-dependent: the main wasm thread blocks while a pthread worker is
    // mid-handshake). It normally initializes in well under a minute, so a stall
    // watchdog (no messages at all for stallMs) terminates the worker and one
    // retry gets a fresh roll of the dice.
    const workerBlobUrl = URL.createObjectURL(new Blob(
      [SHIM + workerCode.replace(/\/\/#\s*sourceMappingURL=.*$/gm, '')],
      { type: 'application/javascript' }));
    const ext = (job.name.split('.').pop() || 'docx').toLowerCase();
    let res = null, worker = null;

    for (let attempt = 1; attempt <= 2 && !res; attempt++) {
      worker = new Worker(workerBlobUrl);
      worker.addEventListener('error', (e) => status('Worker error: ' + e.message, true));

      const send = (type, payload, { timeoutMs, stallMs = 0 }, transfer) => {
        const id = 'lo_' + Math.random().toString(36).slice(2);
        return new Promise((resolve, reject) => {
          let lastMsg = Date.now();
          const fail = (why) => { cleanup(); reject(new Error(why + ' waiting for ' + type)); };
          const timer = setTimeout(() => fail('timeout'), timeoutMs);
          const stall = stallMs ? setInterval(() => {
            if (Date.now() - lastMsg > stallMs) fail('stall (no worker activity)');
          }, 5000) : null;
          const cleanup = () => { clearTimeout(timer); if (stall) clearInterval(stall); worker.removeEventListener('message', handler); };
          const handler = (e) => {
            const d = e.data;
            if (!d || d.id !== id) return;
            lastMsg = Date.now();
            if (d.type === 'progress') {   // init + convert both stream these
              if (d.progress && d.progress.message) status(d.progress.message);
              if (d.progress && d.progress.percent != null) bar(d.progress.percent);
              return;
            }
            cleanup();
            if (d.type === 'error') reject(new Error(d.error || type + ' failed'));
            else resolve(d);
          };
          worker.addEventListener('message', handler);
          worker.postMessage({ type, id, ...payload }, transfer || []);
        });
      };

      try {
        status('Initializing LibreOffice…' + (attempt > 1 ? ' (retry)' : ''));
        await send('init', { sofficeJs, sofficeWasm, sofficeData, sofficeWorkerJs,
                             verbose: false, enableProgressTracking: false },
                   { timeoutMs: 600000, stallMs: 180000 });

        status('Converting ' + job.name + '…');
        // FS.writeFile in the worker requires a typed array — NOT a raw ArrayBuffer.
        // Copy (don't transfer) so the bytes survive for a retry attempt.
        const inputData = new Uint8Array(job.bytes.slice(0));
        res = await send('convert', { inputData, inputExt: ext, outputFormat: 'pdf' },
                         { timeoutMs: 600000 }, [inputData.buffer]);
      } catch (e) {
        try { worker.terminate(); } catch (_) {}
        if (attempt >= 2) throw e;
        console.warn('[convert] attempt ' + attempt + ' failed (' + (e && e.message) + '), retrying with a fresh worker');
      }
    }

    const pdfName = job.name.replace(/\.[^.]+$/, '') + '.pdf';
    const url = URL.createObjectURL(new Blob([res.data], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = pdfName; a.className = 'dl'; a.textContent = 'Save ' + pdfName;
    $result.appendChild(a);
    a.click();   // auto-download; the button stays for retry
    bar(100);
    status('Done — ' + pdfName + ' downloaded. You can close this tab.');
    // NOTE: don't send {type:'destroy'} — the package's destroy path aborts with
    // "'PThread' was not exported". Hard-terminate instead; the tab is done anyway.
    worker.terminate();
  } catch (e) {
    console.error('[convert]', e);
    status('Conversion failed: ' + (e && e.message || e), true);
  }
})();
</script>
</body>
</html>
