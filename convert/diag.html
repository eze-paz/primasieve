<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>converter diagnostics</title>
</head>
<body style="font:13px/1.4 monospace; padding:10px; margin:0; word-break:break-all;">
<h3 style="font:bold 15px monospace">converter diag — screenshot this whole page</h3>
<pre id="out" style="white-space:pre-wrap;"></pre>
<div style="margin-top:12px;font:bold 13px monospace">office-engine iframe (watch for "refused to connect" here):</div>
<div id="frames"></div>
<script>
  const out = document.getElementById('out');
  const log = (...a) => { const s = a.join(' '); out.textContent += s + '\n'; try { console.log('[DIAG]', s); } catch (_) {} };

  log('time         : ' + new Date().toISOString());
  log('UA           : ' + navigator.userAgent);
  log('origin       : ' + location.origin);
  log('href         : ' + location.href);
  log('crossOriginIsolated : ' + self.crossOriginIsolated);
  log('isSecureContext     : ' + self.isSecureContext);
  log('SharedArrayBuffer   : ' + (typeof SharedArrayBuffer !== 'undefined'));
  log('deviceMemory(GB)    : ' + (navigator.deviceMemory ?? 'n/a'));
  log('serviceWorker ctrl  : ' + (('serviceWorker' in navigator) ? !!navigator.serviceWorker.controller : 'no SW API'));
  log('----------------------------------------');

  // catch anything that would otherwise be silent
  addEventListener('securitypolicyviolation', e =>
    log('CSP VIOLATION: directive=' + e.violatedDirective + ' blocked=' + e.blockedURI + ' src=' + e.sourceFile));
  addEventListener('error', e => log('window error: ' + (e.message || e.type) + ' @ ' + (e.filename || '')));
  addEventListener('unhandledrejection', e => log('unhandledrejection: ' + (e.reason && (e.reason.message || e.reason))));
  addEventListener('message', e => { const d = e.data; if (d && d.type) log('postMessage from engine: ' + JSON.stringify(d).slice(0, 240)); });

  // fetch probes (status tells us what the network layer allows)
  async function probe(label, url, opts) {
    try {
      const r = await fetch(url, Object.assign({ method: 'GET' }, opts || {}));
      log('FETCH ' + label + ' -> HTTP ' + r.status + ' ct=' + (r.headers.get('content-type') || '?'));
    } catch (err) { log('FETCH ' + label + ' -> FAILED: ' + (err && err.message || err)); }
  }
  (async () => {
    await probe('proxy/soffice.js', '/proxy/cdn.zetaoffice.net/zetaoffice_latest/soffice.js');
    await probe('direct-CDN/soffice.js (cors)', 'https://cdn.zetaoffice.net/zetaoffice_latest/soffice.js');
    await probe('direct-CDN/soffice.js (no-cors)', 'https://cdn.zetaoffice.net/zetaoffice_latest/soffice.js', { mode: 'no-cors' });
    await probe('proxy/texlive', '/proxy/texlive2.swiftlatex.com/');
    await probe('same-origin office-engine.html', '/convert/office-engine.html');
    log('---- fetch probes done ----');
  })();

  // reproduce the actual embed that fails
  log('embedding /convert/office-engine.html as iframe ...');
  const f = document.createElement('iframe');
  f.style.cssText = 'width:280px;height:120px;border:2px solid #888;';
  f.onload = () => log('office iframe: onload fired');
  f.onerror = (e) => log('office iframe: ONERROR ' + e);
  f.src = '/convert/office-engine.html?diag=1';
  document.getElementById('frames').appendChild(f);
  setTimeout(() => log('(3s) crossOriginIsolated still ' + self.crossOriginIsolated + ' — note if the box above says "refused to connect"'), 3000);

  // *** THE REAL TEST: can this browser show a blob: PDF in an iframe? ***
  // (That is exactly how the converter displays its result. Android Chrome has no
  //  inline PDF viewer, so this iframe is expected to say "refused to connect".)
  const MINI_PDF = '%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj\n4 0 obj<</Length 46>>stream\nBT /F1 24 Tf 30 100 Td (PDF OK) Tj ET\nendstream endobj\n5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF';
  const pdfUrl = URL.createObjectURL(new Blob([MINI_PDF], { type: 'application/pdf' }));
  log('embedding a blob: PDF in an iframe (this is the converter\'s display step) ...');
  const hdr2 = document.createElement('div');
  hdr2.style.cssText = 'margin-top:12px;font:bold 13px monospace';
  hdr2.textContent = 'blob PDF iframe (if THIS says "refused to connect", that is the bug):';
  document.body.appendChild(hdr2);
  const pf = document.createElement('iframe');
  pf.style.cssText = 'width:280px;height:160px;border:2px solid #d33;';
  pf.onload = () => log('blob-PDF iframe: onload fired (may still render blank on Android)');
  pf.onerror = (e) => log('blob-PDF iframe: ONERROR ' + e);
  pf.src = pdfUrl;
  document.body.appendChild(pf);

  // *** THE FIX: render the same PDF with pdf.js into a canvas (works on Android) ***
  const hdr3 = document.createElement('div');
  hdr3.style.cssText = 'margin-top:12px;font:bold 13px monospace';
  hdr3.textContent = 'pdf.js canvas (THE FIX — should show the PDF, not "refused"):';
  document.body.appendChild(hdr3);
  const pjBox = document.createElement('div');
  pjBox.style.cssText = 'border:2px solid #2a2; min-height:60px; background:#fff;';
  document.body.appendChild(pjBox);
  (async () => {
    try {
      log('pdf.js: loading /modules/vendor/pdfjs/pdf.min.js ...');
      await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = '/modules/vendor/pdfjs/pdf.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('pdf.min.js load failed')); document.head.appendChild(sc); });
      if (!window.pdfjsLib) throw new Error('pdfjsLib undefined after load');
      log('pdf.js: lib loaded, setting worker ...');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/modules/vendor/pdfjs/pdf.worker.min.js';
      const doc = await window.pdfjsLib.getDocument({ data: new TextEncoder().encode(MINI_PDF) }).promise;
      log('pdf.js: doc opened, numPages=' + doc.numPages);
      const page = await doc.getPage(1);
      const vp = page.getViewport({ scale: 1 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; pjBox.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      log('pdf.js: RENDER OK — the fix works on this device');
    } catch (err) { log('pdf.js: FAILED -> ' + (err && err.message || err)); }
  })();
</script>
</body>
</html>
