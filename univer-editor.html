<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spreadsheet editor</title>
<link rel="stylesheet" href="vendor/univer/univer.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #bar { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
         background: #1b1f24; color: #d8dee5; font: 12px system-ui, sans-serif; }
  #bar button { background: #2ea043; color: #fff; border: 0; border-radius: 5px;
                padding: 4px 14px; font: 600 12px system-ui; cursor: pointer; }
  #bar button:disabled { background: #444; cursor: default; }
  #fname { font-weight: 600; }
  #status { color: #8b949e; }
  #univer { height: calc(100% - 36px); }
</style>
</head>
<body>
<div id="bar">
  <span id="fname"></span>
  <button id="saveBtn" disabled>Save</button>
  <span id="status">Loading engine…</span>
</div>
<div id="univer"></div>

<script src="vendor/univer/univer.full.umd.js"></script>
<script src="vendor/univer/locale-en.js"></script>
<script>
// Univer sheets workbench in an isolated iframe. Same-origin postMessage
// protocol with modules/univer-editor.js (the host):
//   host  -> { type:'univer-load', name, workbook /* IWorkbookData */ }
//   frame -> { type:'univer-ready' }
//   frame -> { type:'univer-save', workbook }   (Save button / Ctrl+S)
//   host  -> { type:'univer-saved', ok, error? }
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  let univerAPI = null, dirty = false, docUnit = null, kind = 'sheet', readOnly = false;

  function boot(payload, k) {
    kind = k || 'sheet';
    const { Univer, LocaleType, UniverInstanceType } = UniverCore;
    const univer = new Univer({
      theme: UniverDesign.defaultTheme,
      locale: LocaleType.EN_US,
      locales: { [LocaleType.EN_US]: UniverUMD['en-US'] },
    });
    univer.registerPlugin(UniverEngineRender.UniverRenderEnginePlugin);
    univer.registerPlugin(UniverEngineFormula.UniverFormulaEnginePlugin);
    univer.registerPlugin(UniverUi.UniverUIPlugin, { container: 'univer' });
    if (kind === 'doc') {
      // document mode: docs plugins only, the doc IS the scrolling unit
      univer.registerPlugin(UniverDocs.UniverDocsPlugin);
      univer.registerPlugin(UniverDocsUi.UniverDocsUIPlugin);
      docUnit = univer.createUnit(UniverInstanceType.UNIVER_DOC, payload);
    } else {
      univer.registerPlugin(UniverDocs.UniverDocsPlugin, { hasScroll: false });
      univer.registerPlugin(UniverDocsUi.UniverDocsUIPlugin);
      univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
      univer.registerPlugin(UniverSheetsUi.UniverSheetsUIPlugin);
      univer.registerPlugin(UniverSheetsFormula.UniverSheetsFormulaPlugin);
      // optional extras — presence varies across UMD builds, register when there
      try { univer.registerPlugin(UniverSheetsFormulaUi.UniverSheetsFormulaUIPlugin); } catch (_) {}
      try { univer.registerPlugin(UniverSheetsNumfmt.UniverSheetsNumfmtPlugin); } catch (_) {}
      try { univer.registerPlugin(UniverSheetsNumfmtUi.UniverSheetsNumfmtUIPlugin); } catch (_) {}
      univer.createUnit(UniverInstanceType.UNIVER_SHEET, payload);
    }
    univerAPI = UniverFacade.FUniver.newAPI(univer);
    // any command marks the doc dirty (cheap superset of "content changed") —
    // but createUnit itself fires a burst of commands, so arm the listener
    // only after boot settles.
    setTimeout(() => {
      if (readOnly) return;   // no dirty tracking for a read-only extraction
      dirty = false; setStatus('');
      univerAPI.onCommandExecuted(() => { if (!dirty) { dirty = true; setStatus('unsaved changes'); } });
    }, 800);
    $('saveBtn').disabled = false;
    if (!readOnly) setStatus('');
  }

  function setStatus(t) { $('status').textContent = t; }

  function save() {
    if (!univerAPI || readOnly) return;
    setStatus('saving…');
    if (kind === 'doc') {
      // DocumentDataModel from createUnit is the stable snapshot source across builds
      const snap = docUnit && docUnit.getSnapshot ? docUnit.getSnapshot() : null;
      if (!snap) { setStatus('save failed: no doc snapshot'); return; }
      parent.postMessage({ type: 'univer-save', doc: snap }, location.origin);
    } else {
      const wb = univerAPI.getActiveWorkbook();
      if (!wb) return;
      parent.postMessage({ type: 'univer-save', workbook: wb.save() }, location.origin);
    }
  }

  $('saveBtn').addEventListener('click', save);
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

  // ── programmatic ops (the LLM's sheet_edit tool talks to us via these) ──
  // parent -> { type:'univer-op', rpcId, op, args }
  // frame  -> { type:'univer-op-result', rpcId, ok, ...payload | error }
  // Ops act on the ACTIVE sheet unless args.sheet names another. Any 'set'
  // returns a fresh workbook snapshot so the host persists in one round-trip.
  const nextTick = (ms) => new Promise(r => setTimeout(r, ms || 0));
  async function runOp(op, args) {
    if (kind !== 'sheet') throw new Error('the open file is not a spreadsheet');
    if (!univerAPI) throw new Error('editor not ready');
    const wb = univerAPI.getActiveWorkbook();
    const ws = (args && args.sheet) ? wb.getSheetByName(args.sheet) : wb.getActiveSheet();
    if (!ws) throw new Error('sheet not found: ' + (args && args.sheet));
    if (op === 'info') {
      const sheets = (wb.getSheets ? wb.getSheets() : []).map(s => (s.getSheetName ? s.getSheetName() : (s.getName && s.getName())));
      const snap = wb.save();
      const cur = snap.sheets[Object.keys(snap.sheets).find(id => snap.sheets[id].name === (ws.getSheetName ? ws.getSheetName() : null))] || snap.sheets[snap.sheetOrder[0]];
      let maxR = 0, maxC = 0;
      for (const r of Object.keys(cur.cellData || {})) for (const c of Object.keys(cur.cellData[r] || {})) { maxR = Math.max(maxR, +r); maxC = Math.max(maxC, +c); }
      return { sheets, active: ws.getSheetName ? ws.getSheetName() : null, rows: maxR + 1, cols: maxC + 1 };
    }
    if (op === 'read') {
      const rng = (args && args.range) ? args.range : null;
      if (rng) return { values: ws.getRange(rng).getValues() };
      // whole used grid from the snapshot (bounded, avoids reading blank tail)
      const snap = wb.save();
      const cur = snap.sheets[Object.keys(snap.sheets).find(id => snap.sheets[id].name === (ws.getSheetName ? ws.getSheetName() : null))] || snap.sheets[snap.sheetOrder[0]];
      let maxR = -1, maxC = -1;
      for (const r of Object.keys(cur.cellData || {})) for (const c of Object.keys(cur.cellData[r] || {})) { maxR = Math.max(maxR, +r); maxC = Math.max(maxC, +c); }
      const grid = [];
      for (let r = 0; r <= maxR; r++) { const row = []; for (let c = 0; c <= maxC; c++) { const cell = cur.cellData[r] && cur.cellData[r][c]; row.push(cell ? (cell.v !== undefined ? cell.v : '') : ''); } grid.push(row); }
      return { values: grid };
    }
    if (op === 'set') {
      const edits = Array.isArray(args && args.edits) ? args.edits : [];
      if (!edits.length && !(args && args.range && args.values)) throw new Error('set needs edits:[{a1,value|formula}] or {range,values}');
      const formulaCells = [];   // {r,c,f} — injected into the snapshot deterministically
      for (const ed of edits) {
        if (!ed || !ed.a1) continue;
        if (typeof ed.formula === 'string' && ed.formula) {
          const f = ed.formula[0] === '=' ? ed.formula : ('=' + ed.formula);
          ws.getRange(ed.a1).setValue({ f });
          const rc = a1ToRc(ed.a1); formulaCells.push({ r: rc.r, c: rc.c, f });
        } else {
          ws.getRange(ed.a1).setValue(ed.value);
        }
      }
      if (args && args.range && Array.isArray(args.values)) ws.getRange(args.range).setValues(args.values);
      dirty = true; setStatus('unsaved changes');
      // Formula cells register through Univer's ASYNC formula service, so a snapshot
      // taken now may not carry their `f` yet (the computed value lags too). We know
      // the formula strings the caller gave us, so write them into the snapshot
      // directly — deterministic, no race. Univer recomputes the values on reload.
      const snap = wb.save();
      if (formulaCells.length) {
        const sid = Object.keys(snap.sheets).find(id => snap.sheets[id].name === (ws.getSheetName ? ws.getSheetName() : null)) || snap.sheetOrder[0];
        const cd = snap.sheets[sid].cellData;
        for (const fc of formulaCells) {
          const row = (cd[fc.r] = cd[fc.r] || {});
          row[fc.c] = Object.assign({}, row[fc.c], { f: fc.f });
        }
      }
      return { snapshot: snap };   // host writes this back to OPFS
    }
    throw new Error('unknown op: ' + op);
  }

  // "C2" → {r:1, c:2} (0-based). Supports multi-letter columns.
  function a1ToRc(a1) {
    const m = /^([A-Za-z]+)(\d+)$/.exec(String(a1).trim());
    if (!m) return { r: 0, c: 0 };
    let c = 0; for (const ch of m[1].toUpperCase()) c = c * 26 + (ch.charCodeAt(0) - 64);
    return { r: +m[2] - 1, c: c - 1 };
  }

  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'univer-load') {
      $('fname').textContent = e.data.name || '';
      readOnly = !!e.data.readOnly;
      try {
        boot(e.data.doc || e.data.workbook, e.data.doc ? 'doc' : 'sheet');
        if (readOnly) { $('saveBtn').style.display = 'none'; setStatus('read-only (extracted text)'); }
      } catch (err) { setStatus('engine error: ' + err.message); }
    } else if (e.data.type === 'univer-saved') {
      dirty = !e.data.ok;
      setStatus(e.data.ok ? 'saved ✓' : 'save failed: ' + (e.data.error || '?'));
    } else if (e.data.type === 'univer-op') {
      runOp(e.data.op, e.data.args || {})
        .then(payload => parent.postMessage(Object.assign({ type: 'univer-op-result', rpcId: e.data.rpcId, ok: true }, payload), location.origin))
        .catch(err => parent.postMessage({ type: 'univer-op-result', rpcId: e.data.rpcId, ok: false, error: (err && err.message) || String(err) }, location.origin));
    }
  });

  parent.postMessage({ type: 'univer-ready' }, location.origin);
})();
</script>
</body>
</html>
